; AudioVolume
; Panel MUST stay the first meter (Rainmeter draws in section order).
[Rainmeter]
Update=70
AccurateText=1
DynamicWindowSize=1
DefaultWindowX=40
DefaultWindowY=40
OnRefreshAction=["#@#bin\start-helper.vbs"]
OnCloseAction=[!CommandMeasure MeasureKillHelper "Run"]
ContextTitle=Open Windows sound settings
ContextAction=["ms-settings:sound"]
ContextTitle2=Toggle day / night theme
ContextAction2=[!CommandMeasure MeasureTheme "Toggle()"]
ContextTitle3=Open skin folder
ContextAction3=["#CURRENTPATH#"]
ContextTitle4=Refresh skin
ContextAction4=[!Refresh]

[PanelBg]
Meter=Shape
X=6
Y=6
Shape=Rectangle 0,0,368,234,6 | Fill Color #ColorPanel# | StrokeWidth 1 | Stroke Color #ColorPanelLine#
UpdateDivider=-1
DynamicVariables=1

[Metadata]
Name=AudioVolume
Author=jiangxiaomengforxingchen
Version=10.0
License=MIT
Information=Now playing level (big) + system volume, microphone level

[Variables]
; night palette; theme.lua rewrites these when the theme is toggled
ThemeName=night
; panel and cards are both semi-transparent (never fully opaque, never invisible)
ColorPanel=10,22,38,200
ColorPanelLine=64,96,134,170
ColorCard=20,40,64,210
ColorCardLine=92,134,180,190
ColorTitle=255,255,255,255
ColorDim=255,255,255,255
ColorBig=255,255,255,255
ColorBigAlt=150,182,216,255
ColorAccent=72,182,255,255
ColorAccentDim=64,216,178,255
; level read interval = 2 ticks
LevelDivider=2
ColorFrame=92,134,180,190
ColorLabel=168,196,226,255
ColorTrack=110,150,192,120

; ===================== MEASURES =====================
[MeasureKillHelper]
Measure=Plugin
Plugin=RunCommand
Program=cmd.exe
Parameter=/c taskkill /f /im AudioLevelHelper.exe
OutputType=ANSI
State=Hide
UpdateDivider=-1

[MeasureTheme]
Measure=Script
ScriptFile=#@#bin\theme.lua
UpdateDivider=-1

; two independent script files: sibling measures on ONE file share the same Lua table,
; and a multi-value string would be truncated at the first number inside a Calc formula.
[MeasureOutPct]
Measure=Script
ScriptFile=#@#bin\levels-out.lua
UpdateDivider=#LevelDivider#

[MeasureMicPct]
Measure=Script
ScriptFile=#@#bin\levels-mic.lua
UpdateDivider=#LevelDivider#

; system volume: MeasureName binding returns the DEVICE NAME, [MeasureVol:] returns the number
[MeasureVol]
Measure=Plugin
Plugin=Win7AudioPlugin
UpdateDivider=#LevelDivider#

; bar geometry: bottom anchored, grows upward
Formula=60*Max(Min([MeasureOutPct]/100,1),0)+8
DynamicVariables=1
UpdateDivider=-1

Formula=104-(60*Max(Min([MeasureOutPct]/100,1),0))
DynamicVariables=1
UpdateDivider=-1

Formula=60*Max(Min([MeasureMicPct]/100,1),0)+8
DynamicVariables=1
UpdateDivider=-1

Formula=214-(60*Max(Min([MeasureMicPct]/100,1),0))
DynamicVariables=1
UpdateDivider=-1

; ===================== SPEAKER =====================

[S_CardBg]
Meter=Shape
X=14
Y=14
Shape=Rectangle 0,0,352,108,3 | Fill Color #ColorCard# | StrokeWidth 0
Shape2=Rectangle 0,0,352,108,3 | Stroke Color #ColorCardLine# | StrokeWidth 1 | Fill Color 0,0,0,0
Shape3=Rectangle 0,2,4,104,2,0,2,0 | Fill Color #ColorAccent# | StrokeWidth 0
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTheme "Toggle()"]
ToolTipTitle=SPEAKER
ToolTipText=Left click: day / night theme   Right click: menu

[S_Title]
Meter=String
X=28
Y=25
FontFace=Bahnschrift SemiBold
FontSize=12
FontColor=#ColorTitle#
AntiAlias=1
DynamicVariables=1
Text=SPEAKER

[S_Big]
Meter=String
X=28
Y=44
FontFace=Bahnschrift Condensed
FontSize=46
FontColor=#ColorBig#
AntiAlias=1
DynamicVariables=1
MeasureName=MeasureOutPct
Text=%1

[S_Pct]
Meter=String
X=18R
Y=72
FontFace=Bahnschrift
FontSize=14
FontColor=#ColorDim#
AntiAlias=1
DynamicVariables=1
Text=%

; system volume, bottom-aligned with the % sign
[S_Vol]
Meter=String
X=28
Y=102
FontFace=Bahnschrift
FontSize=11
FontColor=#ColorBigAlt#
AntiAlias=1
DynamicVariables=1
Text="system volume [MeasureVol:]%"

[S_Fill]
Meter=Shape
X=0
Y=0
Shape=Rectangle 234,(104-(60*Max(Min([MeasureOutPct:]/100,1),0))),108,(60*Max(Min([MeasureOutPct:]/100,1),0)+8) | Fill Color #ColorAccent# | StrokeWidth 0
DynamicVariables=1
[M_CardBg]
Meter=Shape
X=14
Y=124
Shape=Rectangle 0,0,352,108,3 | Fill Color #ColorCard# | StrokeWidth 0
Shape2=Rectangle 0,0,352,108,3 | Stroke Color #ColorCardLine# | StrokeWidth 1 | Fill Color 0,0,0,0
Shape3=Rectangle 0,2,4,104,2,0,2,0 | Fill Color #ColorAccent# | StrokeWidth 0
DynamicVariables=1
ToolTipTitle=MICROPHONE
ToolTipText=Microphone input level

[M_Title]
Meter=String
X=28
Y=141
FontFace=Bahnschrift SemiBold
FontSize=12
FontColor=#ColorTitle#
AntiAlias=1
DynamicVariables=1
Text=MICROPHONE

[M_Big]
Meter=String
X=28
Y=162
FontFace=Bahnschrift Condensed
FontSize=46
FontColor=#ColorBig#
AntiAlias=1
DynamicVariables=1
MeasureName=MeasureMicPct
Text=%1

[M_Pct]
Meter=String
X=18R
Y=190
FontFace=Bahnschrift
FontSize=14
FontColor=#ColorDim#
AntiAlias=1
DynamicVariables=1
Text=%

[M_Fill]
Meter=Shape
X=0
Y=0
Shape=Rectangle 234,(214-(60*Max(Min([MeasureMicPct:]/100,1),0))),108,(60*Max(Min([MeasureMicPct:]/100,1),0)+8) | Fill Color #ColorAccentDim# | StrokeWidth 0
DynamicVariables=1

OnUpdateAction=[!Log "Q pctNum=[MeasureOutPct:] pctStr=[MeasureOutPct] pctX2=[MeasureOutPct:]*2 fillH=[S_FillH:]"]
